[alembic]
script_location = alembic
prepend_sys_path = .

# Use the SQLite Cloud URL directly
sqlalchemy.url = sqlitecloud://cczvv5ejdk.g3.sqlite.cloud:8860/auth.sqlitecloud?apikey=Uy07gwgw0K5PtPg8LDOsN4HYvmcVPvka4yFdeiXDtFs

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
